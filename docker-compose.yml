services:
  api:
    build:
      context: .
    ports:
      - "7551:7551"
    env_file: .env
    restart: unless-stopped
    # GPU: the Dockerfile installs CUDA 11.8 torch. Remove this block on a CPU-only host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
